name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: dev
            triplet: x64-linux
          - os: ubuntu-latest
            preset: release
            triplet: x64-linux
          - os: windows-latest
            preset: dev
            triplet: x64-mingw-static
          - os: windows-latest
            preset: release
            triplet: x64-mingw-static
          - os: macos-latest
            preset: dev
            triplet: arm64-osx
          - os: macos-latest
            preset: release
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool pkg-config

      - name: Install macOS build prerequisites
        if: runner.os == 'macOS'
        run: brew install autoconf autoconf-archive automake libtool pkg-config

      - name: Bootstrap vcpkg on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 277978ad2eddc3b05ecf288dcd33071968cd2f79
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Bootstrap vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" checkout 277978ad2eddc3b05ecf288dcd33071968cd2f79
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Install independent Python dependencies
        if: matrix.os == 'ubuntu-latest' && matrix.preset == 'dev'
        run: python3 -m pip install -r tools/requirements.txt

      - name: Configure
        if: matrix.preset == 'dev' && matrix.os == 'ubuntu-latest'
        run: cmake --preset dev -DCPCP_ENABLE_REFERENCE_TESTS=ON -DCPCP_ENABLE_LARGE_FILE_TESTS=ON -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Configure
        if: matrix.preset != 'dev' || matrix.os != 'ubuntu-latest'
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Verify independent Python vectors
        if: matrix.os == 'ubuntu-latest' && matrix.preset == 'dev'
        run: |
          python3 -m pip install -r tools/requirements.txt
          python3 tools/verify_crypto_vectors.py

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        preset:
          - asan
          - tsan
    runs-on: ubuntu-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf autoconf-archive automake libtool pkg-config

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout 277978ad2eddc3b05ecf288dcd33071968cd2f79
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install independent Python dependencies
        run: python3 -m pip install -r tools/requirements.txt

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DVCPKG_TARGET_TRIPLET=x64-linux -DCPCP_ENABLE_REFERENCE_TESTS=ON

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset ${{ matrix.preset }}
